<!doctype html><html lang="en"><head><meta charset="utf-8"><title>a/clanker cover</title><link rel="stylesheet" href="tokens.css"><style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:264px;overflow:hidden;font-family:var(--font-sans);background:var(--color-bg);color:var(--color-text);-webkit-font-smoothing:antialiased}
.ghost{position:absolute;left:-60px;top:84px;width:400px;height:260px;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface);padding:28px 28px 0 88px}
.ghost b{display:block;width:30px;height:30px;border-radius:50%;background:var(--color-border-strong);margin:0 0 18px}
.ghost i{display:block;height:9px;border-radius:5px;background:var(--color-border);margin:0 0 16px}
.ghost i:nth-of-type(1){width:92%}.ghost i:nth-of-type(2){width:74%}.ghost i:nth-of-type(3){width:58%}.ghost i:nth-of-type(4){width:86%}
.term{position:absolute;left:560px;top:30px;width:580px;height:300px;border-radius:20px;background:#1c1b19;box-shadow:0 18px 50px -24px rgb(28 27 25 / .45);overflow:hidden;font-family:var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)}
.bar{display:flex;align-items:center;gap:8px;padding:16px 22px;border-bottom:1px solid rgb(255 255 255 / .08)}
.bar span{width:11px;height:11px;border-radius:50%;background:rgb(255 255 255 / .16)}
.bar em{margin-left:10px;font-style:normal;font-size:15px;color:rgb(255 255 255 / .55)}
.body{padding:20px 26px;font-size:19px;line-height:1.75}
.agent{color:rgb(255 255 255 / .78)}.dim{color:rgb(255 255 255 / .45)}.fail{color:#e8907a}.ok{color:#9fd3a8;font-weight:700}
</style></head><body>
<div class="ghost"><b></b><i></i><i></i><i></i><i></i></div>
<div class="term"><div class="bar"><span></span><span></span><span></span><em>cart.spec.ts</em></div><div class="body"><div class="dim">$ npm test -- cart.spec.ts</div><div class="fail">✕ applies discount · 3 of 10 runs</div><div class="agent">agent: await the price before asserting</div><div class="ok">✓ 20 / 20 passed</div></div></div>
</body></html>

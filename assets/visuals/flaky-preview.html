<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Flaky tests preview</title><link rel="stylesheet" href="tokens.css"><style>
*{box-sizing:border-box}body{margin:0;width:800px;height:600px;overflow:hidden;font-family:var(--font-sans);background:var(--color-bg);color:var(--color-text)}.stage{position:relative;width:800px;height:600px;padding:48px;overflow:hidden}.result{display:flex;align-items:baseline;gap:14px;margin:0 0 28px}.number{font-size:76px;line-height:1;font-weight:650;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.of{font-size:32px;color:var(--color-text-tertiary);letter-spacing:-.03em}.passed{margin-left:auto;font-size:18px;font-weight:600;color:var(--color-accent-text)}.terminal{width:704px;height:492px;background:var(--color-ink);color:var(--color-on-ink);border-radius:var(--radius-lg);padding:28px 32px;box-shadow:var(--shadow-md)}.terminal-head{display:flex;align-items:center;justify-content:space-between;font-size:16px;padding-bottom:24px;border-bottom:1px solid var(--color-text-secondary)}.terminal-head span:last-child{color:var(--color-border-strong)}.rows{padding-top:20px;font-family:var(--font-mono);font-size:21px}.row{display:flex;gap:18px;padding:14px 0;align-items:center}.tick{color:var(--color-accent-fill)}.row.focus{background:var(--color-text-secondary);margin:0 -14px;padding-inline:14px;border-radius:var(--radius-sm)}.fix{margin-top:28px;padding-top:22px;border-top:1px solid var(--color-text-secondary);font-family:var(--font-mono);font-size:17px;color:var(--color-accent-border)}
</style></head><body><main class="stage"><div class="result"><span class="number">20<span class="of"> / 20</span></span><span class="passed">Runs passed</span></div><div class="terminal"><div class="terminal-head"><b>After the fix</b><span>cart.spec.ts</span></div><div class="rows"><div class="row"><span class="tick">✓</span><span>checkout.spec.ts</span></div><div class="row focus"><span class="tick">✓</span><span>cart.spec.ts</span></div><div class="row"><span class="tick">✓</span><span>search.spec.ts</span></div><div class="row"><span class="tick">✓</span><span>profile.spec.ts</span></div></div><div class="fix">await the response</div></div></main></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent spend dashboard</title>
  <link rel="stylesheet" href="style.css">
  <!-- three.js pinned to one version, loaded as ES modules. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header>
    <h1>Agent spend, last week</h1>
    <p id="total"></p>
    <ul id="legend"></ul>
  </header>
  <canvas id="scene" aria-label="3D bar chart of agent spend by day and tool"></canvas>
  <p id="note"></p>
  <script type="module" src="main.js"></script>
</body>
</html>
